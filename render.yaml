services:
  - type: web
    name: jarvis-web-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node web-server.js
    healthCheckPath: /api/status
    envVars:
      - key: GEMINI_API_KEY
        sync: true
      - key: BHARATCODE_API_KEY
        sync: true
      - key: ALLOWED_ORIGIN
        value: http://localhost:3000
        sync: true
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
        sync: true
